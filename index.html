function grafSimples(dados, campo, cor){
  if(!dados.length) return '<p class="aviso">Sem dados ainda.</p>';
  var max = 0;
  dados.forEach(function(d){ max = Math.max(max, d[campo]||0); });
  if(max <= 0) return '<p class="aviso">Sem valores ainda.</p>';
  return '<div class="graf">' + dados.map(function(d){
    var alt = Math.max(2, Math.round((d[campo]||0)/max*96));
    return '<div class="col"><div class="pil" style="height:' + alt + 'px;background:' + cor + '"></div>' +
      '<span class="rot">' + nomeMes(d.chave).slice(0,3) + '</span></div>';
  }).join("") + '</div>';
}

function previsaoProximos(n){
  var base = chaveMes(new Date()), out = [];
  for(var i=0;i<n;i++){
    var k = moveMes(base, i), t = 0, c = 0;
    (estado.fixas||[]).forEach(function(f){
      if(!valeNoMes(f, k)) return;
      t += f.valor || 0; c++;
    });
    out.push({k:k, total:t, qtd:c});
  }
  return out;
}

function rotuloVigencia(f){
  var partes0 = [];
  if(f.desde) partes0.push("desde " + mesCurto(f.desde));
  if(f.ate) partes0.push("até " + mesCurto(f.ate));
  return partes0.length ? partes0.join(" · ") : "sem prazo";
}

    var hojeK = chaveMes(new Date());
    var dPrazo = folha.querySelector("#dica-prazo");
    var dAporte = folha.querySelector("#dica-aporte");
    if(dPrazo){
      var n = Math.max(1, Number(folha.querySelector("#f-meses").value) || 1);
      dPrazo.textContent = falta > 0
        ? "Guardando " + fmt(falta/n) + " por mês, você conquista em " + mesCurto(moveMes(hojeK, n-1)) + "."
        : "Informe quanto custa a meta.";
    }
    if(dAporte){
      var men = lerDinheiro("mensal");
      if(men > 0 && falta > 0){
        var k = Math.ceil(falta/men);
        dAporte.textContent = "Você chega lá em " + k + (k === 1 ? " mês" : " meses") + " — " + mesCurto(moveMes(hojeK, k-1)) + ".";
      }else{
        dAporte.textContent = "Informe quanto custa e quanto dá para guardar.";
      }
    }
  }

  var campos = folha.querySelectorAll("#f-alvo, #f-inicial, #f-meses, #f-mensal");
  for(var i=0;i<campos.length;i++) campos[i].addEventListener("input", atualizarDicas);

  var modos = folha.querySelectorAll("[data-modo]");
  for(var j=0;j<modos.length;j++){
    (function(b){
      b.addEventListener("click", function(){
        folha.dataset.modo = b.dataset.modo;
        for(var q=0;q<modos.length;q++) modos[q].classList.toggle("ativo", modos[q] === b);
        atualizarDicas();
      });
    })(modos[j]);
  }

  var sugs = folha.querySelectorAll("[data-sug]");
  for(var s=0;s<sugs.length;s++){
    (function(b){
      b.addEventListener("click", function(){
        var el = folha.querySelector("#f-alvo");
        var v = Number(b.dataset.sug);
        el.dataset.cent = String(Math.round(v*100));
        el.value = fmt(v);
        atualizarDicas();
      });
    })(sugs[s]);
  }

  atualizarDicas();
}

function ligarBackup(){
  var arq = folha.querySelector("#f-arquivo");
  if(!arq) return;
  arq.addEventListener("change", function(){
    var f = arq.files && arq.files[0];
    if(!f) return;
    var leitor = new FileReader();
    leitor.onload = function(){
      folha.querySelector("#f-backup").value = String(leitor.result || "");
      recado("Arquivo carregado. Toque em Restaurar.");
    };
    leitor.onerror = function(){ recado("Não deu para ler o arquivo"); };
    leitor.readAsText(f);
  });
}

function baixarBackup(){
  try{
    var blob = new Blob([JSON.stringify(estado, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "carne-familia-leite-" + chaveMes(new Date()) + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    registrarBackup();
    recado("Backup baixado");
  }catch(e){ recado("Baixar não funcionou aqui — use Copiar backup"); }
}

        '<label class="check"><input type="checkbox" id="f-ativo"' + (d.ativo !== false ? " checked" : "") +

  }
}

function fecharFolha(){
  fundo.classList.remove("aberta");
  folha.classList.remove("aberta");
  contexto = null;
}

folha.addEventListener("change", function(e){
  if(!contexto || contexto.tipo !== "modelo") return;
  if(!e.target.dataset || !e.target.dataset.modelo) return;
  var botao = folha.querySelector('[data-f="modelo-salvar"]');
  if(!botao) return;
  var n = folha.querySelectorAll('input[data-modelo]:checked').length;
  botao.textContent = rotuloModelo(n);
  botao.disabled = (n === 0);
  botao.style.opacity = n === 0 ? ".5" : "1";
});

fundo.addEventListener("click", fecharFolha);
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && contexto) fecharFolha(); });

folha.addEventListener("click", function(e){
  var b = e.target.closest("[data-f]");
  if(!b || !contexto) return;
  var acao = b.dataset.f;
  var ctx = contexto;
  var m = garantirMes(mesAtivo);

  if(acao === "usar-camera"){ var idcam = ctx.dado.id; fecharFolha(); pedirComprovante(idcam, "camera"); return; }
  if(acao === "usar-arquivo"){ var idarq = ctx.dado.id; fecharFolha(); pedirComprovante(idarq, "arquivo"); return; }
  if(acao === "editar-conta"){ var ide = ctx.dado; fecharFolha(); setTimeout(function(){ abrirFolha({tipo:"conta", dado:ide}); }, 280); return; }
  if(acao === "trocar-comp"){ var idc = ctx.dado; fecharFolha(); setTimeout(function(){ abrirFolha({tipo:"comprovar", dado:idc}); }, 280); return; }
  if(acao === "desfazer-pag"){ var idd = ctx.dado.id; fecharFolha(); desfazerPagamento(idd); return; }
  if(acao === "sem-comprovante"){ var ids = ctx.dado.id; fecharFolha(); pagarSemComprovante(ids); return; }

  if(acao === "sync-conectar"){
    var repo = (folha.querySelector("#f-repo").value || "").trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,"");
    var tok = (folha.querySelector("#f-token").value || "").trim();
    if(repo.indexOf("/") < 0){ recado("Use o formato usuario/repositorio"); return; }
    if(!tok){ recado("Cole o token"); return; }
    sync.repo = repo; sync.token = tok; sync.ativo = true; sync.sha = null;
    sync.perfil = (folha.querySelector("#f-perfil").value || "").trim();
    salvarSync();
    situacaoSync = "indo"; pintarSync();
    baixarSync().then(function(remoto){
      if(situacaoSync === "erro"){ recado("Não consegui acessar · confira repositório e token"); return; }
      if(remoto && remoto.meses){
        var tl = estado.atualizadoEm ? Date.parse(estado.atualizadoEm) : 0;
        var tr = remoto.atualizadoEm ? Date.parse(remoto.atualizadoEm) : 0;
        if(tr >= tl){ adotarRemoto(remoto); fecharFolha(); recado("Conectado · dados do repositório carregados"); return; }
      }
      enviarSync(false).then(function(ok){ if(ok){ fecharFolha(); render(); } });
    });
    return;
  }

  if(acao === "sync-sair"){
    sync.ativo = false; sync.token = ""; sync.sha = null; sync.ultima = null;
    salvarSync(); situacaoSync = "off";
    fecharFolha(); render();
    recado("Desconectado deste aparelho");
    return;
  }

  if(acao === "baixar-backup"){ baixarBackup(); return; }

  if(acao === "copiar-backup"){
    var txtB = folha.querySelector("#f-backup").value;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txtB).then(
        function(){ registrarBackup(); recado("Backup copiado"); },
        function(){ recado("Selecione o texto e copie manualmente"); }
      );
    }else{
      folha.querySelector("#f-backup").select();
      recado("Selecione o texto e copie manualmente");
    }
    return;
  }

  if(acao === "restaurar"){
    var bruto = (folha.querySelector("#f-backup").value || "").trim();
    var novo = null;
    try{ novo = JSON.parse(bruto); }catch(erroJ){ novo = null; }
    if(!novo || !novo.meses){ recado("Esse texto não parece um backup válido"); return; }
    estado = novo;
    estado.fixas = estado.fixas || [];
    estado.metas = estado.metas || [];
    estado.meses = estado.meses || {};
    mesAtivo = chaveMes(new Date());
    salvar(); fecharFolha(); render();
    recado("Dados restaurados");
    return;
  }

  if(acao === "modelo-salvar"){
    var marcados = folha.querySelectorAll('input[data-modelo]:checked');
    if(!marcados.length) return;
    for(var q=0;q<marcados.length;q++){
      var el = marcados[q];
      estado.fixas.push(tocar({
        id:id(), nome:el.dataset.nome, categoria:el.dataset.cat,
        dia:Number(el.dataset.dia), valor:0, ativo:true,
        desde:chaveMes(new Date()), ate:null
      }));
    }
    var qtd = marcados.length;
    salvar(); fecharFolha(); render();
    recado(qtd + (qtd === 1 ? " conta criada" : " contas criadas") + ". Agora informe os valores.");
    return;
  }

  if(acao === "salvar" && ctx.tipo === "investimento"){
    var nomeI = (folha.querySelector("#f-nome").value || "").trim();
    if(!nomeI){ recado("Dê um nome à aplicação"); return; }
    var tipoI = folha.querySelector("#f-tipo").value;
    var instI = (folha.querySelector("#f-inst").value || "").trim();
    if(ctx.dado){
      ctx.dado.nome = nomeI; ctx.dado.tipo = tipoI; ctx.dado.instituicao = instI;
      tocar(ctx.dado);
    }else{
      var sal = lerDinheiro("saldo"), apo = lerDinheiro("aport");
      var nv = tocar({id:id(), nome:nomeI, tipo:tipoI, instituicao:instI, aportes:[], saldos:[]});
      if(apo > 0) nv.aportes.push({id:id(), data:agora(), valor:apo});
      if(sal > 0) nv.saldos.push({id:id(), data:agora(), valor:sal});
      estado.investimentos.push(nv);
    }
    salvar(); fecharFolha(); render();
    return;
  }

  if(acao === "salvar" && ctx.tipo === "inv-mov"){
    var vv = lerDinheiro("valor");
    if(vv <= 0){ recado("Informe o valor"); return; }
    if(ctx.modo === "aporte"){
      ctx.dado.aportes = ctx.dado.aportes || [];
      ctx.dado.aportes.push({id:id(), data:agora(), valor:vv});
      ctx.dado.saldos = ctx.dado.saldos || [];
      ctx.dado.saldos.push({id:id(), data:agora(), valor:saldoInv(ctx.dado) + vv});
      recado("Aporte de " + fmt(vv) + " registrado");
    }else{
      ctx.dado.saldos = ctx.dado.saldos || [];
      ctx.dado.saldos.push({id:id(), data:agora(), valor:vv});
      var rr = vv - totalAportes(ctx.dado);
      recado(rr >= 0 ? "Rendimento acumulado: " + fmt(rr) : "Saldo atualizado");
    }
    tocar(ctx.dado);
    salvar(); fecharFolha(); render();
    return;
  }

  if(acao === "excluir" && ctx.tipo === "limpar" && b.dataset.confirma === "1"){
    if(ctx.modo === "mes"){
      var mm = estado.meses[mesAtivo];
      if(mm){ (mm.itens||[]).forEach(function(i){ matar(i.id); }); mm.itens = []; mm.entradas = []; mm.rotina = {}; }
      recado("Mês limpo");
    }else if(ctx.modo === "cache"){
      abrirIDB().then(function(db){
        if(!db) return;
        try{ var t = db.transaction("arq","readwrite"); t.objectStore("arq").clear(); }catch(e){}
      });
      recado("Cache de imagens apagado");
      fecharFolha(); return;
    }else{
      estado = padrao();
      normalizarEstado();
      abrirIDB().then(function(db){
        if(!db) return;
        try{ var t2 = db.transaction("arq","readwrite"); t2.objectStore("arq").clear(); }catch(e){}
      });
      mesAtivo = chaveMes(new Date());
      aba = "contas";
      recado("Tudo apagado");
    }
    salvar(); fecharFolha(); render();
    return;
  }

  if(acao === "excluir" && ctx.tipo === "investimento" && b.dataset.confirma === "1"){
    matar(ctx.dado.id);
    estado.investimentos = estado.investimentos.filter(function(x){ return x.id !== ctx.dado.id; });
    salvar(); fecharFolha(); render();
    recado("Aplicação removida");
    return;
  }

  if(acao === "excluir" && b.dataset.confirma !== "1"){
    b.dataset.confirma = "1";
    b.dataset.rotulo = b.textContent;
    b.textContent = "Toque de novo para confirmar";
    b.style.background = "var(--carimbo)";
    b.style.color = "#fff";
    b.style.borderColor = "var(--carimbo)";
    setTimeout(function(){
      if(b && b.dataset.confirma === "1"){
        b.dataset.confirma = "";
        b.textContent = b.dataset.rotulo || "Excluir";
        b.style.background = ""; b.style.color = ""; b.style.borderColor = "";
      }
    }, 4000);
    return;
  }

  if(acao === "excluir"){
    if(ctx.tipo === "meta"){
      if(ctx.dado.fixaId){
        estado.fixas = estado.fixas.filter(function(f){ return f.id !== ctx.dado.fixaId; });
        Object.keys(estado.meses).forEach(function(k){
          estado.meses[k].itens = estado.meses[k].itens.filter(function(i){
            return !(i.metaId === ctx.dado.id && !i.pago);
          });
        });
      }
      matar(ctx.dado.id);
      estado.metas = estado.metas.filter(function(x){ return x.id !== ctx.dado.id; });
      recado("Meta removida");
      salvar(); fecharFolha(); render(); return;
    }
    if(ctx.tipo === "entrada"){
      matar(ctx.dado.id);
      m.entradas = m.entradas.filter(function(x){ return x.id !== ctx.dado.id; });
    }else if(ctx.tipo === "fixa"){
      matar(ctx.dado.id);
      estado.fixas = estado.fixas.filter(function(x){ return x.id !== ctx.dado.id; });
      Object.keys(estado.meses).forEach(function(k){
        estado.meses[k].itens = estado.meses[k].itens.filter(function(x){
          if(x.fixaId === ctx.dado.id && !x.pago){ matar(x.id); return false; }
          return true;
        });
      });
      recado("Conta fixa removida");
    }else{
      if(ctx.dado.fixaId) m.fixasRemovidas.push(ctx.dado.fixaId);
      matar(ctx.dado.id);
      m.itens = m.itens.filter(function(x){ return x.id !== ctx.dado.id; });
    }
    salvar(); fecharFolha(); render(); return;
  }

  if(acao === "alternar"){ var alvo = ctx.dado.id; fecharFolha(); alternarPago(alvo); return; }

  if(acao === "salvar"){
    if(ctx.tipo === "aporte"){
      var vAp = lerDinheiro("valor");
      if(vAp <= 0){ recado("Informe o valor guardado"); return; }
      ctx.dado.extras = ctx.dado.extras || [];
      ctx.dado.extras.push({id:id(), data:new Date().toISOString(), valor:vAp});
      var cAp = calculoMeta(ctx.dado);
      sincronizarMeta(ctx.dado, cAp.mensal);
      salvar(); fecharFolha(); render();
      recado(cAp.completa ? "Meta conquistada!" : "Faltam " + fmt(cAp.falta));
      return;
    }

    if(ctx.tipo === "meta"){
      var nomeM = (folha.querySelector("#f-nome").value || "").trim();
      if(!nomeM){ folha.querySelector("#f-nome").focus(); recado("Dê um nome para a meta"); return; }
      var alvoM = lerDinheiro("alvo");
      if(alvoM <= 0){ folha.querySelector("#f-alvo").focus(); recado("Informe quanto custa a meta"); return; }

      var meta = ctx.dado;
      if(!meta){
        meta = {id:id(), tipo: ctx.reserva ? "reserva" : "objetivo", criadaEm:chaveMes(new Date()), extras:[], fixaId:null};
        estado.metas.push(meta);
      }
      meta.nome = nomeM;
      meta.alvo = alvoM;
      meta.inicial = lerDinheiro("inicial");
      meta.modo = folha.dataset.modo === "aporte" ? "aporte" : "prazo";
      meta.dia = Math.min(31, Math.max(1, Number(folha.querySelector("#f-dia").value) || 5));
      meta.noCarne = folha.querySelector("#f-carne").checked;
      tocar(meta);
      if(meta.modo === "prazo"){
        var nM = Math.max(1, Number(folha.querySelector("#f-meses").value) || 1);
        meta.alvoEm = moveMes(chaveMes(new Date()), nM - 1);
      }else{
        meta.mensal = lerDinheiro("mensal");
      }
      var cM = calculoMeta(meta);
      sincronizarMeta(meta, cM.mensal);
      salvar(); fecharFolha(); render();
      if(meta.noCarne && isFinite(cM.mensal) && cM.mensal > 0){
        recado(fmt(cM.mensal) + " por mês, no dia " + meta.dia);
      }
      return;
    }

    var nomeEl = folha.querySelector("#f-nome");
    var nome = (nomeEl.value || "").trim();
    if(!nome){ nomeEl.focus(); recado("Dê um nome para essa conta"); return; }
    var valor = lerDinheiro("valor");

    if(ctx.tipo === "entrada"){
      if(ctx.dado){ ctx.dado.nome = nome; ctx.dado.valor = valor; tocar(ctx.dado); }
      else m.entradas.push(tocar({id:id(), nome:nome, valor:valor}));
      if(!estado.renda) estado.renda = valor;
    }else{
      var dia = Math.min(31, Math.max(1, Number(folha.querySelector("#f-dia").value) || 1));
      var categoria = folha.querySelector("#f-cat").value;

      if(ctx.tipo === "fixa"){
        var ativo = folha.querySelector("#f-ativo").checked;
        var desdeV = (folha.querySelector("#f-desde").value || "").trim() || chaveMes(new Date());
        var ateV = (folha.querySelector("#f-ate").value || "").trim() || null;
        if(ateV && ateV < desdeV) ateV = desdeV;
        if(ctx.dado){
          ctx.dado.nome = nome; ctx.dado.valor = valor; ctx.dado.dia = dia;
          ctx.dado.categoria = categoria; ctx.dado.ativo = ativo;
          ctx.dado.desde = desdeV; ctx.dado.ate = ateV;
          tocar(ctx.dado);
          limparForaDeVigencia(ctx.dado);
          if(ativo) aplicarFixaNosMeses(ctx.dado);
          Object.keys(estado.meses).forEach(function(k){
            estado.meses[k].itens.forEach(function(i){
              if(i.fixaId === ctx.dado.id && !i.pago){
                i.nome = nome; i.dia = dia; i.categoria = categoria;
                if(!i.valor) i.valor = valor;
              }
            });
          });
        }else{
          var nf = tocar({id:id(), nome:nome, valor:valor, dia:dia, categoria:categoria, ativo:ativo, desde:desdeV, ate:ateV});
          estado.fixas.push(nf);
          if(ativo) aplicarFixaNosMeses(nf);
          recado("Vai entrar em todos os meses a partir de " + mesCurto(desdeV));
        }
      }else{
        if(ctx.dado){
          ctx.dado.nome = nome; ctx.dado.valor = valor; ctx.dado.dia = dia; ctx.dado.categoria = categoria; tocar(ctx.dado);
        }else{
          var rep = folha.querySelector("#f-repetir").checked;
          var novo = {id:id(), nome:nome, valor:valor, dia:dia, categoria:categoria, pago:false, pagoEm:null};
          if(rep){
            var f = tocar({id:id(), nome:nome, valor:valor, dia:dia, categoria:categoria, ativo:true, desde:mesAtivo, ate:null});
            estado.fixas.push(f);
            novo.fixaId = f.id;
            novo.id = f.id + "@" + mesAtivo;
            m.itens.push(tocar(novo));
            aplicarFixaNosMeses(f);
            recado("Lançada aqui e em todos os próximos meses");
          }else{
            m.itens.push(tocar(novo));
          }
        }
      }
    }
    salvar(); fecharFolha(); render();
  }
});

var alvoAnexo = null;
function acharItem(iid){
  var m = garantirMes(mesAtivo), achado = null;
  m.itens.forEach(function(x){ if(x.id === iid) achado = x; });
  return achado;
}

function pedirComprovante(iid, origem){
  alvoAnexo = iid;
  var ent = document.getElementById(origem === "camera" ? "entrada-camera" : "entrada-arquivo");
  ent.value = "";
  ent.click();
}

function receberArquivo(file){
  var i = acharItem(alvoAnexo);
  if(!i || !file) return;
  recado("Preparando o comprovante…");
  comprimir(file).then(function(r){
    var comp = {id:id(), tipo:r.tipo, ext:r.ext, em:agora(), nome:(file.name || "comprovante")};
    return guardarImg(comp.id, r.dados).then(function(){
      i.comprovante = comp;
      i.pago = true;
      i.pagoEm = agora();
      i.pagoPor = sync.perfil || "";
      i.semComprovante = false;
      tocar(i);
      recemPago = i.id;
      salvar();
      render();
      subirComprovante(comp, r.dados);
      var mv = i.metaId ? acharMeta(i.metaId) : null;
      if(mv){
        var cv = calculoMeta(mv);
        recado(cv.completa ? mv.nome + " conquistada!" : "Guardado · faltam " + fmt(cv.falta));
      }else{
        recado("Comprovante anexado · conta quitada");
      }
    });
  }).catch(function(e){
    recado(e && e.message === "grande" ? "Arquivo muito grande · tire uma foto" : "Não consegui ler esse arquivo");
  });
}

function desfazerPagamento(iid){
  var i = acharItem(iid);
  if(!i) return;
  i.pago = false; i.pagoEm = null; i.pagoPor = null;
  i.comprovante = null; i.semComprovante = false;
  tocar(i);
  salvar(); render();
  recado("Pagamento desfeito");
}

function pagarSemComprovante(iid){
  var i = acharItem(iid);
  if(!i) return;
  i.pago = true; i.pagoEm = agora(); i.pagoPor = sync.perfil || "";
  i.semComprovante = true; i.comprovante = null;
  tocar(i); recemPago = i.id;
  salvar(); render();
  recado("Marcada como paga · sem comprovante");
}

function alternarPago(itemId){
  var m = garantirMes(mesAtivo);
  var i = null;
  m.itens.forEach(function(x){ if(x.id === itemId) i = x; });
  if(!i) return;
  i.pago = !i.pago;
  i.pagoEm = i.pago ? new Date().toISOString() : null;
  if(i.pago){ i.pagoPor = sync.perfil || ""; i.semComprovante = true; }
  tocar(i);
  if(i.pago) recemPago = i.id;
  salvar();
  render();
  if(i.pago && i.metaId){
    var mv = acharMeta(i.metaId);
    if(mv){
      var cv = calculoMeta(mv);
      recado(cv.completa ? mv.nome + " conquistada!" : "Guardado · faltam " + fmt(cv.falta) + " para " + mv.nome);
      return;
    }
  }
  if(i.pago && resumo(mesAtivo).aberto === 0) recado("Tudo quitado em " + nomeMes(mesAtivo));
}

function rotuloModelo(n){
  if(n === 0) return "Marque ao menos uma conta";
  return "Adicionar " + n + (n === 1 ? " conta fixa" : " contas fixas");
}

function telaModelo(){
  var pre = 0;
  var html = '<h2 id="folha-titulo">Modelo Família Leite</h2>' +
    '<p class="aviso" style="margin-bottom:6px">Marque o que existe na sua casa. Tudo entra como conta fixa, com valor zerado para você preencher depois.</p>';

  MODELO_LEITE.forEach(function(g){
    html += '<div class="grupo-modelo"><p class="eyebrow">' + esc(g.grupo) + '</p><div class="cartao" style="margin-top:8px">';
    g.itens.forEach(function(it){
      var ja = estado.fixas.some(function(f){ return f.nome === it.nome; });
      var marcar = !ja && it.padrao;
      if(marcar) pre++;
      html += '<label class="item-modelo' + (ja ? " ja" : "") + '">' +
        '<input type="checkbox" data-modelo="1" data-nome="' + esc(it.nome) + '" data-cat="' + it.categoria + '" data-dia="' + it.dia + '"' +
          (ja ? " disabled" : (marcar ? " checked" : "")) + '>' +
        '<span>' + esc(it.nome) + (ja ? " · já cadastrada" : "") + '</span>' +
        '<span class="rot-dia">dia ' + it.dia + '</span></label>';
    });
    html += '</div></div>';
  });

  html += '<div class="rodape-fixo"><button class="btn largo" data-f="modelo-salvar"' +
    (pre === 0 ? ' disabled style="opacity:.5"' : "") + '>' + rotuloModelo(pre) + '</button></div>';
  return html;
}

function copiarCSV(){
  var m = garantirMes(mesAtivo);
  var linhas = [["Mes","Conta","Categoria","Bloco","Dia","Valor","Situacao","Pago em","Pago por","Comprovante"].join(";")];
  m.itens.forEach(function(i){
    var cat = CATS[i.categoria] || CATS.outros;
    linhas.push([
      mesAtivo, i.nome, cat.nome, cat.bloco, i.dia,
      (i.valor||0).toFixed(2).replace(".", ","),
      situacao(i, mesAtivo),
      i.pagoEm ? new Date(i.pagoEm).toLocaleDateString("pt-BR") : "",
      i.pagoPor || "",
      i.comprovante ? "sim" : (i.pago ? "nao" : "")
    ].join(";"));
  });
  var txt = linhas.join("\n");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(
      function(){ recado("CSV copiado — cole no Excel"); },
      function(){ recado("Não deu para copiar aqui"); }
    );
  }else{
    recado("Copiar não está disponível neste navegador");
  }
}

document.getElementById("tela").addEventListener("click", function(e){
  var alvo = e.target.closest("[data-acao]");
  if(!alvo) return;
  var a = alvo.dataset.acao;
  if(a === "rotina") return;
  var m = garantirMes(mesAtivo);
  var achado = null;

  if(a === "pagar"){ var ip = acharItem(alvo.dataset.id); if(ip) abrirFolha({tipo:"comprovar", dado:ip}); }
  else if(a === "ver-comprovante"){ var iv = acharItem(alvo.dataset.id); if(iv) abrirFolha({tipo:"comprovante", dado:iv}); }
  else if(a === "alternar"){ alternarPago(alvo.dataset.id); }
  else if(a === "editar"){
    m.itens.forEach(function(x){ if(x.id === alvo.dataset.id) achado = x; });
    if(achado) abrirFolha({tipo:"conta", dado:achado});
  }
  else if(a === "editar-fixa"){
    estado.fixas.forEach(function(x){ if(x.id === alvo.dataset.id) achado = x; });
    if(achado) abrirFolha({tipo:"fixa", dado:achado});
  }
  else if(a === "editar-entrada"){
    m.entradas.forEach(function(x){ if(x.id === alvo.dataset.id) achado = x; });
    if(achado) abrirFolha({tipo:"entrada", dado:achado});
  }
  else if(a === "nova"){ abrirFolha({tipo:"conta"}); }
  else if(a === "nova-fixa"){ abrirFolha({tipo:"fixa"}); }
  else if(a === "nova-entrada"){ abrirFolha({tipo:"entrada"}); }
  else if(a === "nova-meta"){ abrirFolha({tipo:"meta"}); }
  else if(a === "nova-reserva"){ abrirFolha({tipo:"meta", reserva:true}); }
  else if(a === "editar-meta"){ var mt = acharMeta(alvo.dataset.id); if(mt) abrirFolha({tipo:"meta", dado:mt}); }
  else if(a === "aporte"){ var ma = acharMeta(alvo.dataset.id); if(ma) abrirFolha({tipo:"aporte", dado:ma}); }
  else if(a === "ajustar-meta"){
    var mj = acharMeta(alvo.dataset.id);
    if(mj){ sincronizarMeta(mj, calculoMeta(mj).mensal); salvar(); render(); recado("Carnê atualizado"); }
  }
  else if(a === "modelo"){ abrirFolha({tipo:"modelo"}); }
  else if(a === "csv"){ copiarCSV(); }
  else if(a === "backup"){ abrirFolha({tipo:"backup"}); }
  else if(a === "ir-fixas"){ irAba("fixas"); }
  else if(a === "ir-investimentos"){ irAba("investimentos"); }
  else if(a === "ir-conquistas"){ irAba("conquistas"); }
  else if(a === "ir-config"){ irAba("config"); }
  else if(a === "nova-inv"){ abrirFolha({tipo:"investimento"}); }
  else if(a === "editar-inv"){ var vi = acharInv(alvo.dataset.id); if(vi) abrirFolha({tipo:"investimento", dado:vi}); }
  else if(a === "inv-aporte"){ var va = acharInv(alvo.dataset.id); if(va) abrirFolha({tipo:"inv-mov", dado:va, modo:"aporte"}); }
  else if(a === "inv-saldo"){ var vs = acharInv(alvo.dataset.id); if(vs) abrirFolha({tipo:"inv-mov", dado:vs, modo:"saldo"}); }
  else if(a === "salvar-perfil"){
    sync.perfil = (document.getElementById("c-perfil").value || "").trim();
    salvarSync(); recado("Nome salvo");
  }
  else if(a === "tema"){ aplicarTema(alvo.dataset.t); render(); }
  else if(a === "limpar-mes"){ abrirFolha({tipo:"limpar", modo:"mes"}); }
  else if(a === "limpar-cache"){ abrirFolha({tipo:"limpar", modo:"cache"}); }
  else if(a === "limpar-tudo"){ abrirFolha({tipo:"limpar", modo:"tudo"}); }
  else if(a === "sync-config"){ abrirFolha({tipo:"sync"}); }
  else if(a === "sync-enviar"){ enviarSync(false); }
  else if(a === "sync-baixar"){
    baixarSync().then(function(remoto){
      if(remoto && remoto.meses){ adotarRemoto(remoto); recado("Dados baixados do repositório"); }
      else recado("Nada encontrado no repositório ainda");
    });
  }
});

  irMes(-1);
});
document.getElementById("prox").addEventListener("click", function(){ irMes(1); });
document.getElementById("ir-hoje").addEventListener("click", function(){ mesAtivo = chaveMes(new Date()); animarLista = true; render(); });
document.getElementById("fab").addEventListener("click", function(){
  if(aba === "metas") abrirFolha({tipo:"meta"});
  else if(aba === "investimentos") abrirFolha({tipo:"investimento"});
  else abrirFolha({tipo: aba === "fixas" ? "fixa" : "conta"});
});

var abasBtns = document.querySelectorAll(".abas button");
for(var k=0;k<abasBtns.length;k++){
  (function(b){
    b.addEventListener("click", function(){ irAba(b.dataset.aba); });
  })(abasBtns[k]);
}

if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}

(function(){
  var tela = document.getElementById("tela");
  var px = 0, py = 0, ativo = false;
  tela.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1){ ativo = false; return; }
    px = e.touches[0].clientX; py = e.touches[0].clientY; ativo = true;
  }, {passive:true});
  tela.addEventListener("touchend", function(e){
    if(!ativo) return;
    ativo = false;
    if(aba !== "contas" && aba !== "plano") return;
    var t = e.changedTouches[0];
    var dx = t.clientX - px, dy = t.clientY - py;
    if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy)*1.6) return;
    irMes(dx < 0 ? 1 : -1);
  }, {passive:true});
  tela.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    var alvo = e.target.closest('[role="button"][data-acao]');
    if(!alvo) return;
    e.preventDefault();
    alvo.click();
  });
})();

carregarSync();
aplicarTema(sync.tema || "auto");
carregarTudo().then(function(salvo){
  estado = (salvo && salvo.meses) ? salvo : padrao();
  normalizarEstado();
  arrumarRecorrencias();
  pintarStatus();
  render();
  pendente = estado; processarFila();
  sincronizarNoInicio();
});

})();
</script>
</body>
</html>
